services:
  # ── Backend: FastAPI ──────────────────────────────────────────────────────
  - type: web
    name: geminichat-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: geminichat-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a random value
      - key: GEMINI_API_KEY
        sync: false           # You must set this manually in Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false           # Google OAuth web client ID
      - key: CORS_ALLOWED_ORIGIN
        value: https://geminichat-ui.onrender.com   # Update after frontend deploy

  # ── Frontend: React SPA ───────────────────────────────────────────────────
  - type: web
    name: geminichat-ui
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://geminichat-api.onrender.com   # Update with your backend URL
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false           # Same Google OAuth web client ID as the backend

# ── PostgreSQL database ───────────────────────────────────────────────────────
databases:
  - name: geminichat-db
    region: oregon
    plan: free
    databaseName: geminichat
    user: geminichat
